[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sledge-prover"
version = "0.1.0"
description = "Hand an AI agent Isabelle's Sledgehammer — prove statements with an honest VERIFIED / REFUTED / UNKNOWN."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Meghan Bao" }]
keywords = ["isabelle", "sledgehammer", "theorem-proving", "autoformalization", "llm", "mcp", "agents", "verifier"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.optional-dependencies]
# mcp requires Python >=3.10; the core library and CLI work on 3.9 without it.
mcp = ["mcp>=1.2,<2; python_version >= '3.10'"]
dev = ["pytest>=7", "mcp>=1.2,<2; python_version >= '3.10'", "build>=1.2", "twine>=5.0"]

[project.scripts]
sledge = "sledge.cli:main"
sledge-mcp = "sledge.mcp_server:main"

[project.urls]
Homepage = "https://github.com/MeghanBao/sledge"
Repository = "https://github.com/MeghanBao/sledge"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sledge = ["py.typed"]
